<svg viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eduTitle eduDesc">
  <title id="eduTitle">Education</title>
  <desc id="eduDesc">Bannari Amman Institute of Technology, Bachelor's Degree in Artificial Intelligence and Machine Learning, CGPA 8.99, September 2023 to present</desc>
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <filter id="g6" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid6" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#101d33" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="150" fill="url(#bg6)"/>
  <rect width="1200" height="150" fill="url(#grid6)"/>

  <rect x="30" y="20" width="1140" height="110" rx="14" fill="#0b1220" fill-opacity="0.4" stroke="#22d3ee" stroke-width="1.4" filter="url(#g6)"/>

  <!-- vector graduation cap icon -->
  <g transform="translate(105,75)" filter="url(#g6)">
    <path d="M-22,-3 L0,-13 L22,-3 L0,7 Z" fill="#0b1220" stroke="#67e8f9" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-11,2 V12 Q0,19 11,12 V2" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="-3" x2="22" y2="10" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="22" cy="13" r="2" fill="#67e8f9"/>
  </g>

  <text x="165" y="55" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="14" fill="#67e8f9" letter-spacing="1">EDUCATION</text>
  <text x="165" y="78" font-family="'Segoe UI',Arial,sans-serif" font-weight="600" font-size="16" fill="#e6f6ff">Bannari Amman Institute of Technology</text>
  <text x="165" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#9fb3c8">Bachelor's Degree — Artificial Intelligence &amp; Machine Learning</text>

  <line x1="740" y1="35" x2="740" y2="115" stroke="#1e293b" stroke-width="1"/>

  <text x="785" y="70" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#9fb3c8" letter-spacing="1">CGPA</text>
  <text x="785" y="95" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="20" fill="#22d3ee">8.99</text>

  <line x1="940" y1="35" x2="940" y2="115" stroke="#1e293b" stroke-width="1"/>

  <text x="985" y="70" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#9fb3c8" letter-spacing="1">DURATION</text>
  <text x="985" y="95" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="15" fill="#e6f6ff">Sep 2023 — Present</text>
</svg>
