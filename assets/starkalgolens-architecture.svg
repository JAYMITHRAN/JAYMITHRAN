<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="starkTitle starkDesc">
  <title id="starkTitle">StarkAlgoLens architecture diagram</title>
  <desc id="starkDesc">Flow diagram: user code into React UI into FastAPI backend, branching into Tree-sitter analysis, Docker secure execution, and AI engine, converging into a MySQL, MongoDB and Firebase persistence layer, then developer insights</desc>
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <filter id="g3" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid3" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#101d33" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="url(#bg3)"/>
  <rect width="1200" height="700" fill="url(#grid3)"/>
  <rect x="12" y="12" width="1176" height="676" rx="16" fill="#0b1220" fill-opacity="0.3" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.2"/>

  <text x="600" y="46" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="22" fill="#e6f6ff" letter-spacing="1.5" filter="url(#g3)">STARKALGOLENS — SYSTEM ARCHITECTURE</text>

  <!-- USER CODE -->
  <rect x="500" y="70" width="200" height="44" rx="10" fill="#0b1220" stroke="#67e8f9" stroke-width="1.5" filter="url(#g3)"/>
  <text x="600" y="97" text-anchor="middle" font-family="monospace" font-size="13" fill="#67e8f9">USER CODE</text>
  <line x1="600" y1="114" x2="600" y2="150" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- REACT UI -->
  <rect x="480" y="150" width="240" height="46" rx="10" fill="#0b1220" stroke="#818cf8" stroke-width="1.5" filter="url(#g3)"/>
  <text x="600" y="172" text-anchor="middle" font-family="monospace" font-size="13" fill="#a5b4fc">REACT FRONTEND</text>
  <text x="600" y="188" text-anchor="middle" font-family="monospace" font-size="10" fill="#c7d2fe" opacity="0.8">Vite + Tailwind CSS</text>
  <line x1="600" y1="196" x2="600" y2="232" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FASTAPI -->
  <rect x="470" y="232" width="260" height="46" rx="10" fill="#0b1220" stroke="#38bdf8" stroke-width="1.5" filter="url(#g3)"/>
  <text x="600" y="260" text-anchor="middle" font-family="monospace" font-size="13" fill="#7dd3fc">FASTAPI BACKEND</text>

  <!-- Branch lines -->
  <path d="M600 278 V300 H240 V330" fill="none" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M600 278 V320" fill="none" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M600 278 V300 H960 V330" fill="none" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- TREE-SITTER -->
  <rect x="120" y="330" width="240" height="46" rx="10" fill="#0b1220" stroke="#34d399" stroke-width="1.5" filter="url(#g3)"/>
  <text x="240" y="358" text-anchor="middle" font-family="monospace" font-size="12" fill="#6ee7b7">TREE-SITTER (AST)</text>
  <line x1="240" y1="376" x2="240" y2="415" stroke="#34d399" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="240" y="440" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#d1fae5">Time &amp; Space</text>
  <text x="240" y="456" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#d1fae5">Complexity Analysis</text>

  <!-- DOCKER -->
  <rect x="480" y="330" width="240" height="46" rx="10" fill="#0b1220" stroke="#38bdf8" stroke-width="1.5" filter="url(#g3)"/>
  <text x="600" y="358" text-anchor="middle" font-family="monospace" font-size="12" fill="#7dd3fc">DOCKER ISOLATION</text>
  <line x1="600" y1="376" x2="600" y2="415" stroke="#38bdf8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="600" y="440" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#bae6fd">Secure Multi-Language</text>
  <text x="600" y="456" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#bae6fd">Code Execution</text>

  <!-- AI ENGINE -->
  <rect x="840" y="330" width="240" height="46" rx="10" fill="#0b1220" stroke="#a78bfa" stroke-width="1.5" filter="url(#g3)"/>
  <text x="960" y="358" text-anchor="middle" font-family="monospace" font-size="12" fill="#c4b5fd">AI ENGINE (Groq API)</text>
  <line x1="960" y1="376" x2="960" y2="415" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="960" y="440" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#ede9fe">Personalized Learning</text>
  <text x="960" y="456" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#ede9fe">Roadmaps &amp; Insights</text>

  <!-- convergence -->
  <path d="M240 465 V490 H960 V490" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.6"/>
  <path d="M600 465 V490" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.6"/>
  <path d="M960 465 V490" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.6"/>
  <line x1="600" y1="490" x2="600" y2="504" stroke="#22d3ee" stroke-width="1.5"/>

  <!-- DATA / PERSISTENCE layer -->
  <text x="600" y="518" text-anchor="middle" font-family="monospace" font-size="12" fill="#67e8f9" letter-spacing="1.5">DATA / PERSISTENCE</text>

  <path d="M600 522 V532 H350 V544" fill="none" stroke="#a78bfa" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M600 522 V544" fill="none" stroke="#a78bfa" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M600 522 V532 H850 V544" fill="none" stroke="#a78bfa" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="245" y="544" width="210" height="42" rx="10" fill="#0b1220" stroke="#a78bfa" stroke-width="1.4" filter="url(#g3)"/>
  <text x="350" y="570" text-anchor="middle" font-family="monospace" font-size="12" fill="#c4b5fd">MySQL</text>

  <rect x="495" y="544" width="210" height="42" rx="10" fill="#0b1220" stroke="#a78bfa" stroke-width="1.4" filter="url(#g3)"/>
  <text x="600" y="570" text-anchor="middle" font-family="monospace" font-size="12" fill="#c4b5fd">MongoDB</text>

  <rect x="745" y="544" width="210" height="42" rx="10" fill="#0b1220" stroke="#a78bfa" stroke-width="1.4" filter="url(#g3)"/>
  <text x="850" y="570" text-anchor="middle" font-family="monospace" font-size="12" fill="#c4b5fd">Firebase</text>

  <!-- final convergence -->
  <path d="M350 586 V602 H850 V602" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.6"/>
  <path d="M600 586 V602" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.6"/>
  <path d="M850 586 V602" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.6"/>
  <line x1="600" y1="602" x2="600" y2="616" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="440" y="616" width="320" height="46" rx="10" fill="#0b1220" stroke="#67e8f9" stroke-width="1.6" filter="url(#g3)"/>
  <text x="600" y="644" text-anchor="middle" font-family="monospace" font-size="13" fill="#67e8f9">DEVELOPER INSIGHTS &amp; PROGRESS TRACKING</text>
</svg>
