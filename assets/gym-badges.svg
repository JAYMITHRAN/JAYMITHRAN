<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gbTitle gbDesc">
  <title id="gbTitle">Gym Badges &amp; Regional Hall of Fame</title>
  <desc id="gbDesc">Four verified Pokémon-style gym badges: TN State Gold Medalist, IndiaSkills South Region Bronze Medalist, BIT B.Tech AI/ML Academy Badge, and Battle Academy Trainer License.</desc>
  <defs>
    <linearGradient id="gbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="gbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gbGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132035" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#gbBg)"/>
  <rect width="1200" height="280" fill="url(#gbGrid)"/>

  <!-- ================= BADGE 1: TN STATE GOLD ================= -->
  <g transform="translate(25, 20)">
    <rect width="270" height="240" rx="14" fill="#0b1220" fill-opacity="0.65" stroke="#facc15" stroke-width="1.4" filter="url(#gbGlow)"/>
    <rect x="0" y="0" width="270" height="4" rx="2" fill="#facc15"/>
    
    <!-- Vector Gold Medal -->
    <g transform="translate(135, 60)" filter="url(#gbGlow)">
      <circle cx="0" cy="0" r="22" fill="#070b14" stroke="#facc15" stroke-width="2.2"/>
      <path d="M-8,-14 L0,2 L8,-14" stroke="#facc15" stroke-width="1.8" fill="none"/>
      <!-- Star -->
      <polygon points="0,-7 2.2,-2 7.5,-1.5 3.5,2.2 4.6,7.5 0,4.8 -4.6,7.5 -3.5,2.2 -7.5,-1.5 -2.2,-2" fill="#facc15"/>
    </g>

    <text x="135" y="112" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#fde047">TN STATE CHAMPION</text>
    <text x="135" y="132" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#34d399">🥇 1st Prize — Gold Medal</text>
    <text x="135" y="158" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#94a3b8">IT Network Administration</text>
    <text x="135" y="176" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#64748b">Awarded by TN Sports Ministry</text>
    
    <rect x="35" y="196" width="200" height="24" rx="6" fill="#facc15" fill-opacity="0.1" stroke="#facc15" stroke-width="0.8"/>
    <text x="135" y="212" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="#fde047">STATE CHAMPION BADGE</text>
  </g>

  <!-- ================= BADGE 2: INDIASKILLS BRONZE ================= -->
  <g transform="translate(315, 20)">
    <rect width="270" height="240" rx="14" fill="#0b1220" fill-opacity="0.65" stroke="#fb923c" stroke-width="1.4" filter="url(#gbGlow)"/>
    <rect x="0" y="0" width="270" height="4" rx="2" fill="#fb923c"/>
    
    <!-- Vector Bronze Shield -->
    <g transform="translate(135, 60)" filter="url(#gbGlow)">
      <path d="M-18,-18 L18,-18 L18,2 Q18,18 0,24 Q-18,18 -18,2 Z" fill="#070b14" stroke="#fb923c" stroke-width="2.2"/>
      <polygon points="0,-8 2.2,-3 7.5,-2.5 3.5,1.2 4.6,6.5 0,3.8 -4.6,6.5 -3.5,1.2 -7.5,-2.5 -2.2,-3" fill="#fb923c"/>
    </g>

    <text x="135" y="112" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#fed7aa">SOUTH REGION ELITE</text>
    <text x="135" y="132" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#fb923c">🥉 IndiaSkills Bronze Medal</text>
    <text x="135" y="158" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#94a3b8">IT Network Administration</text>
    <text x="135" y="176" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#64748b">Live Multi-Vendor Defense</text>
    
    <rect x="35" y="196" width="200" height="24" rx="6" fill="#fb923c" fill-opacity="0.1" stroke="#fb923c" stroke-width="0.8"/>
    <text x="135" y="212" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="#fdba74">REGIONAL ELITE BADGE</text>
  </g>

  <!-- ================= BADGE 3: ACADEMY CREDENTIALS ================= -->
  <g transform="translate(605, 20)">
    <rect width="270" height="240" rx="14" fill="#0b1220" fill-opacity="0.65" stroke="#22d3ee" stroke-width="1.4" filter="url(#gbGlow)"/>
    <rect x="0" y="0" width="270" height="4" rx="2" fill="#22d3ee"/>
    
    <!-- Vector Graduation Cap -->
    <g transform="translate(135, 60)" filter="url(#gbGlow)">
      <path d="M-20,-2 L0,-12 L20,-2 L0,8 Z" fill="#070b14" stroke="#22d3ee" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M-10,3 V12 Q0,18 10,12 V3" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
      <circle cx="20" cy="12" r="2.2" fill="#22d3ee"/>
    </g>

    <text x="135" y="112" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#a5f3fc">ACADEMY MASTER</text>
    <text x="135" y="132" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#22d3ee">Bannari Amman Inst. Tech</text>
    <text x="135" y="158" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#94a3b8">B.Tech — AI &amp; Machine Learning</text>
    <text x="135" y="176" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="700" fill="#facc15">CGPA: 8.99 / 10.0</text>
    
    <rect x="35" y="196" width="200" height="24" rx="6" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-width="0.8"/>
    <text x="135" y="212" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="#67e8f9">ALUMNI HONORS BADGE</text>
  </g>

  <!-- ================= BADGE 4: TRAINER LICENSE ================= -->
  <g transform="translate(895, 20)">
    <rect width="270" height="240" rx="14" fill="#0b1220" fill-opacity="0.65" stroke="#a78bfa" stroke-width="1.4" filter="url(#gbGlow)"/>
    <rect x="0" y="0" width="270" height="4" rx="2" fill="#a78bfa"/>
    
    <!-- Vector Mentor Starburst -->
    <g transform="translate(135, 60)" filter="url(#gbGlow)">
      <circle cx="0" cy="0" r="18" fill="#070b14" stroke="#a78bfa" stroke-width="2.2"/>
      <circle cx="0" cy="-4" r="5" fill="#a78bfa"/>
      <path d="M-9,10 Q0,4 9,10" stroke="#a78bfa" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <text x="135" y="112" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#e9d5ff">TRAINER LICENSE</text>
    <text x="135" y="132" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#c084fc">Student Technical Trainer</text>
    <text x="135" y="158" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#94a3b8">Mentored 60+ Engineers</text>
    <text x="135" y="176" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#64748b">120+ Lab Instruction Hours</text>
    
    <rect x="35" y="196" width="200" height="24" rx="6" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-width="0.8"/>
    <text x="135" y="212" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="#c4b5fd">OFFICIAL TRAINER PASS</text>
  </g>
</svg>
