<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gbTitle gbDesc">
  <title id="gbTitle">Gym Badges &amp; Regional Hall of Fame</title>
  <desc id="gbDesc">Four verified Pokémon-style gym badges: TN State Gold Medalist, IndiaSkills South Region Bronze Medalist, BIT B.Tech AI/ML Academy Badge, and Battle Academy Trainer License.</desc>
  <defs>
    <linearGradient id="gbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="gbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gbGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132035" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#gbBg)"/>
  <rect width="1200" height="300" fill="url(#gbGrid)"/>

  <!-- ================= BADGE 1: TN STATE GOLD ================= -->
  <g transform="translate(25, 20)">
    <rect width="270" height="260" rx="14" fill="#0b1220" fill-opacity="0.75" stroke="#facc15" stroke-width="1.5" filter="url(#gbGlow)"/>
    <rect x="0" y="0" width="270" height="5" rx="2.5" fill="#facc15"/>
    
    <!-- Vector Gold Medal -->
    <g transform="translate(135, 62)" filter="url(#gbGlow)">
      <circle cx="0" cy="0" r="25" fill="#070b14" stroke="#facc15" stroke-width="2.5"/>
      <path d="M-9,-16 L0,2 L9,-16" stroke="#facc15" stroke-width="2" fill="none"/>
      <!-- Star -->
      <polygon points="0,-8 2.5,-2 8.5,-1.5 4,2.5 5.2,8.5 0,5.5 -5.2,8.5 -4,2.5 -8.5,-1.5 -2.5,-2" fill="#facc15"/>
    </g>

    <text x="135" y="118" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="14.5" font-weight="800" fill="#fde047">TN STATE CHAMPION</text>
    <text x="135" y="142" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#34d399">🥇 1st Prize — Gold Medal</text>
    <text x="135" y="170" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">IT Network Administration</text>
    <text x="135" y="190" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8">TN Sports Development Ministry</text>
    
    <rect x="30" y="212" width="210" height="28" rx="7" fill="#facc15" fill-opacity="0.15" stroke="#facc15" stroke-width="1"/>
    <text x="135" y="231" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="800" fill="#fde047">STATE CHAMPION BADGE</text>
  </g>

  <!-- ================= BADGE 2: INDIASKILLS BRONZE ================= -->
  <g transform="translate(315, 20)">
    <rect width="270" height="260" rx="14" fill="#0b1220" fill-opacity="0.75" stroke="#fb923c" stroke-width="1.5" filter="url(#gbGlow)"/>
    <rect x="0" y="0" width="270" height="5" rx="2.5" fill="#fb923c"/>
    
    <!-- Vector Bronze Shield -->
    <g transform="translate(135, 62)" filter="url(#gbGlow)">
      <path d="M-20,-20 L20,-20 L20,3 Q20,20 0,27 Q-20,20 -20,3 Z" fill="#070b14" stroke="#fb923c" stroke-width="2.5"/>
      <polygon points="0,-9 2.5,-3 8.5,-2.8 4,1.5 5.2,7.5 0,4.5 -5.2,7.5 -4,1.5 -8.5,-2.8 -2.5,-3" fill="#fb923c"/>
    </g>

    <text x="135" y="118" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="14.5" font-weight="800" fill="#fed7aa">SOUTH REGION ELITE</text>
    <text x="135" y="142" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#fb923c">🥉 IndiaSkills Bronze Medal</text>
    <text x="135" y="170" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">IT Network Administration</text>
    <text x="135" y="190" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8">Live Multi-Vendor Defense</text>
    
    <rect x="30" y="212" width="210" height="28" rx="7" fill="#fb923c" fill-opacity="0.15" stroke="#fb923c" stroke-width="1"/>
    <text x="135" y="231" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="800" fill="#fdba74">REGIONAL ELITE BADGE</text>
  </g>

  <!-- ================= BADGE 3: ACADEMY CREDENTIALS ================= -->
  <g transform="translate(605, 20)">
    <rect width="270" height="260" rx="14" fill="#0b1220" fill-opacity="0.75" stroke="#22d3ee" stroke-width="1.5" filter="url(#gbGlow)"/>
    <rect x="0" y="0" width="270" height="5" rx="2.5" fill="#22d3ee"/>
    
    <!-- Vector Graduation Cap -->
    <g transform="translate(135, 62)" filter="url(#gbGlow)">
      <path d="M-22,-3 L0,-14 L22,-3 L0,9 Z" fill="#070b14" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-11,4 V14 Q0,21 11,14 V4" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="22" cy="14" r="2.5" fill="#22d3ee"/>
    </g>

    <text x="135" y="118" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="14.5" font-weight="800" fill="#a5f3fc">ACADEMY MASTER</text>
    <text x="135" y="142" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#22d3ee">Bannari Amman Inst. Tech</text>
    <text x="135" y="170" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1">B.Tech — AI &amp; Machine Learning</text>
    <text x="135" y="190" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="800" fill="#facc15">CGPA: 8.99 / 10.0</text>
    
    <rect x="30" y="212" width="210" height="28" rx="7" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-width="1"/>
    <text x="135" y="231" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="800" fill="#67e8f9">ALUMNI HONORS BADGE</text>
  </g>

  <!-- ================= BADGE 4: TRAINER LICENSE ================= -->
  <g transform="translate(895, 20)">
    <rect width="270" height="260" rx="14" fill="#0b1220" fill-opacity="0.75" stroke="#a78bfa" stroke-width="1.5" filter="url(#gbGlow)"/>
    <rect x="0" y="0" width="270" height="5" rx="2.5" fill="#a78bfa"/>
    
    <!-- Vector Mentor Starburst -->
    <g transform="translate(135, 62)" filter="url(#gbGlow)">
      <circle cx="0" cy="0" r="20" fill="#070b14" stroke="#a78bfa" stroke-width="2.5"/>
      <circle cx="0" cy="-5" r="5.5" fill="#a78bfa"/>
      <path d="M-10,11 Q0,5 10,11" stroke="#a78bfa" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>

    <text x="135" y="118" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="14.5" font-weight="800" fill="#e9d5ff">TRAINER LICENSE</text>
    <text x="135" y="142" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#c084fc">Student Technical Trainer</text>
    <text x="135" y="170" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Mentored 60+ Engineers</text>
    <text x="135" y="190" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8">120+ Lab Instruction Hours</text>
    
    <rect x="30" y="212" width="210" height="28" rx="7" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-width="1"/>
    <text x="135" y="231" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="800" fill="#c4b5fd">OFFICIAL TRAINER PASS</text>
  </g>
</svg>
