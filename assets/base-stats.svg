    <text x="16" y="26" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#64748b">ENGINEERS MENTORED</text>
    <text x="16" y="48" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#38bdf8">60+ Junior Students</text>
    <text x="344" y="46" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#94a3b8">Hands-on Labs</text>
