<svg viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bsTitle bsDesc">
  <title id="bsTitle">Verified Technical Metrics &amp; Performance Highlights</title>
  <desc id="bsDesc">Concrete verified metrics: 8.99 CGPA, State Gold Medal, IndiaSkills Bronze Medal, 60+ Junior Engineers Mentored, 120+ Lab Hours, and Production Deployments.</desc>
  <defs>
    <linearGradient id="bsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="bsGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="bsGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132035" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1200" height="240" fill="url(#bsBg)"/>
  <rect width="1200" height="240" fill="url(#bsGrid)"/>

  <rect x="16" y="16" width="1168" height="208" rx="14" fill="#0b1220" fill-opacity="0.7" stroke="#22d3ee" stroke-width="1.3" filter="url(#bsGlow)"/>
  
  <!-- Header Bar -->
  <rect x="16" y="16" width="1168" height="36" rx="14" fill="#070b14"/>
  <text x="36" y="39" font-family="'JetBrains Mono',monospace" font-size="12.5" font-weight="700" fill="#22d3ee" letter-spacing="1">⚡ VERIFIED ENGINEERING HIGHLIGHTS // POKÉDEX NO. #0899</text>

  <!-- 6 Metrics Grid (2 rows of 3) -->
  <!-- ROW 1 -->
  <!-- Metric 1: CGPA -->
  <g transform="translate(36, 68)">
    <rect width="360" height="64" rx="10" fill="#070b14" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#64748b">ACADEMIC STANDING</text>
    <text x="16" y="48" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#facc15">8.99 / 10.0 CGPA</text>
