<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tcTitle tcDesc">
  <title id="tcTitle">Pokédex Trainer Card — Jaymithran Radhakrishnan</title>
  <desc id="tcDesc">Futuristic Pokédex Trainer ID card displaying Jaymithran Radhakrishnan, ID #0899, B.Tech in Artificial Intelligence and Machine Learning, with typing badges and specialization stats.</desc>
  <defs>
    <linearGradient id="tcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="50%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#0c1222"/>
    </linearGradient>
    <linearGradient id="tcBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="tcGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="tcGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132035" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#tcBg)"/>
  <rect width="1200" height="320" fill="url(#tcGrid)"/>

  <!-- Card Frame -->
  <rect x="14" y="14" width="1172" height="292" rx="16" fill="#0b1220" fill-opacity="0.7" stroke="url(#tcBorder)" stroke-width="1.6" filter="url(#tcGlow)"/>

  <!-- Header Accent Line -->
  <rect x="14" y="14" width="1172" height="6" rx="3" fill="url(#tcBorder)"/>

  <!-- Left: Pokédex Emblem Badge -->
  <g transform="translate(110, 150)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="62" fill="#070b14" stroke="#22d3ee" stroke-width="2.5" filter="url(#tcGlow)"/>
    <!-- Pokéball Top Half (Crimson) -->
    <path d="M-54,0 A54,54 0 0,1 54,0 Z" fill="#ef4444" fill-opacity="0.85"/>
    <!-- Pokéball Bottom Half (Dark Slate) -->
    <path d="M-54,0 A54,54 0 0,0 54,0 Z" fill="#1e293b"/>
    <!-- Center Dividing Band -->
    <rect x="-54" y="-5" width="108" height="10" fill="#070b14"/>
    <!-- Center Button Outer -->
    <circle cx="0" cy="0" r="18" fill="#070b14" stroke="#22d3ee" stroke-width="2.5"/>
    <!-- Center Button Inner Glow -->
    <circle cx="0" cy="0" r="9" fill="#22d3ee" filter="url(#tcGlow)"/>
    <!-- Label Below -->
    <text x="0" y="82" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#22d3ee" letter-spacing="1.5">ID: #0899</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="210" y1="36" x2="210" y2="286" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Content Block -->
  <g transform="translate(240, 50)">
    <!-- Top Pill: Status -->
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#10b981"/>
    <text x="24" y="16" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600" fill="#34d399" letter-spacing="1">STATUS: ONLINE</text>

    <text x="180" y="16" font-family="'JetBrains Mono',monospace" font-size="11" fill="#64748b">REGION: SOUTH INDIA (TAMIL NADU)</text>

    <!-- Trainer Name -->
    <text x="0" y="58" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="28" fill="#f8fafc" letter-spacing="1">
      JAYMITHRAN RADHAKRISHNAN
    </text>

    <!-- Role & Degree -->
    <text x="0" y="86" font-family="'Segoe UI',Arial,sans-serif" font-weight="600" font-size="16" fill="#22d3ee">
      B.Tech in Artificial Intelligence and Machine Learning
    </text>
    <text x="0" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#94a3b8">
      AI/ML Systems Developer • Enterprise Network Administrator • Automation Engineer
    </text>

    <!-- Typing Pills -->
    <g transform="translate(0, 130)">
      <!-- Electric -->
      <rect x="0" y="0" width="115" height="28" rx="8" fill="#facc15" fill-opacity="0.15" stroke="#facc15" stroke-width="1.2"/>
      <text x="57" y="18" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#fde047">⚡ ELECTRIC</text>

      <!-- Steel -->
      <rect x="125" y="0" width="105" height="28" rx="8" fill="#94a3b8" fill-opacity="0.15" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="177" y="18" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#cbd5e1">🛡️ STEEL</text>

      <!-- Psychic -->
      <rect x="240" y="0" width="115" height="28" rx="8" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-width="1.2"/>
      <text x="297" y="18" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#e9d5ff">🧠 PSYCHIC</text>

      <!-- Dragon -->
      <rect x="365" y="0" width="120" height="28" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="425" y="18" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#7dd3fc">🐉 RAYQUAZA</text>
    </g>

    <!-- Bio Statement -->
    <text x="0" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#cbd5e1" font-style="italic">
      "Building intelligent automation pipelines, enterprise hypervisors, and AI-assisted developer tools through hands-on code."
    </text>
  </g>

  <!-- Right: Mini Quick Metrics Box -->
  <g transform="translate(940, 48)">
    <rect x="0" y="0" width="220" height="225" rx="12" fill="#070b14" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="110" y="32" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#22d3ee" letter-spacing="1">TRAINER METRICS</text>
    <line x1="20" y1="46" x2="200" y2="46" stroke="#1e293b" stroke-width="1"/>

    <!-- Metric 1: CGPA -->
    <text x="20" y="75" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#64748b">ACADEMIC CGPA</text>
    <text x="200" y="75" text-anchor="end" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="15" fill="#facc15">8.99 / 10</text>

    <!-- Metric 2: State Gold -->
    <text x="20" y="115" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#64748b">TN SKILLS</text>
    <text x="200" y="115" text-anchor="end" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="14" fill="#34d399">🥇 GOLD MEDAL</text>

    <!-- Metric 3: IndiaSkills -->
    <text x="20" y="155" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#64748b">INDIASKILLS</text>
    <text x="200" y="155" text-anchor="end" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="14" fill="#fb923c">🥉 BRONZE MEDAL</text>

    <!-- Metric 4: Mentorship -->
    <text x="20" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#64748b">MENTORSHIP</text>
    <text x="200" y="195" text-anchor="end" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="14" fill="#a78bfa">60+ STUDENTS</text>
  </g>
</svg>
