<svg viewBox="0 0 1200 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tcTitle tcDesc">
  <title id="tcTitle">Developer Profile Card — Jaymithran Radhakrishnan</title>
  <desc id="tcDesc">Profile card with Jaymithran Radhakrishnan, B.Tech in Artificial Intelligence and Machine Learning, technical domains, location, and quote.</desc>
  <defs>
    <linearGradient id="tcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="50%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#0c1222"/>
    </linearGradient>
    <linearGradient id="tcBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="tcGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="tcGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132035" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#tcBg)"/>
  <rect width="1200" height="350" fill="url(#tcGrid)"/>

  <!-- Card Frame -->
  <rect x="14" y="14" width="1172" height="322" rx="16" fill="#0b1220" fill-opacity="0.75" stroke="url(#tcBorder)" stroke-width="1.8" filter="url(#tcGlow)"/>

  <!-- Header Accent Line -->
  <rect x="14" y="14" width="1172" height="6" rx="3" fill="url(#tcBorder)"/>

  <!-- Left: Emblem / Avatar Frame -->
  <g transform="translate(115, 165)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="68" fill="#070b14" stroke="#22d3ee" stroke-width="3" filter="url(#tcGlow)"/>
    <!-- Pokéball Top Half (Crimson) -->
    <path d="M-60,0 A60,60 0 0,1 60,0 Z" fill="#ef4444" fill-opacity="0.95"/>
    <!-- Pokéball Bottom Half (Pure Clean White) -->
    <path d="M-60,0 A60,60 0 0,0 60,0 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Center Dividing Band -->
    <rect x="-60" y="-6" width="120" height="12" fill="#070b14"/>
    <!-- Center Button Outer -->
    <circle cx="0" cy="0" r="20" fill="#070b14" stroke="#22d3ee" stroke-width="3"/>
    <!-- Center Button Inner Glow -->
    <circle cx="0" cy="0" r="10" fill="#22d3ee" filter="url(#tcGlow)"/>
    <!-- Label Below -->
    <text x="0" y="92" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="800" fill="#22d3ee" letter-spacing="2">ID: #0899</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="225" y1="36" x2="225" y2="316" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Center Content Block -->
  <g transform="translate(255, 50)">
    <!-- Top Pill: Status -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="14" cy="13" r="4.5" fill="#10b981"/>
    <text x="28" y="17.5" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#34d399" letter-spacing="1">STATUS: ACTIVE ⚡</text>

    <!-- Name -->
    <text x="0" y="66" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="33" fill="#f8fafc" letter-spacing="1">
      JAYMITHRAN RADHAKRISHNAN
    </text>

    <!-- Degree in Full Form -->
    <text x="0" y="98" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="19" fill="#22d3ee">
      B.Tech in Artificial Intelligence and Machine Learning 🎓
    </text>

    <!-- Sub-role -->
    <text x="0" y="125" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#94a3b8">
      AI/ML Systems Developer • Enterprise Network Administrator • Automation Engineer
    </text>

    <!-- Technical Domain Pills (Real names) -->
    <g transform="translate(0, 148)">
      <!-- Coding -->
      <rect x="0" y="0" width="120" height="32" rx="8" fill="#facc15" fill-opacity="0.15" stroke="#facc15" stroke-width="1.4"/>
      <text x="60" y="21" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#fde047">💻 CODING</text>

      <!-- Networking -->
      <rect x="130" y="0" width="155" height="32" rx="8" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-width="1.4"/>
      <text x="207.5" y="21" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#67e8f9">🌐 NETWORKING</text>

      <!-- Artificial Intelligence -->
      <rect x="295" y="0" width="145" height="32" rx="8" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-width="1.4"/>
      <text x="367.5" y="21" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#e9d5ff">🤖 AI / ML</text>

      <!-- SQL / Databases -->
      <rect x="450" y="0" width="130" height="32" rx="8" fill="#fb923c" fill-opacity="0.15" stroke="#fb923c" stroke-width="1.4"/>
      <text x="515" y="21" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#fdba74">🗄️ SQL &amp; DB</text>
    </g>

    <!-- Iconic Quote (Enlarged & Prominent) -->
    <g transform="translate(0, 224)">
      <text x="0" y="0" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#facc15" font-style="italic" letter-spacing="0.5">
        "The hardest choices require the strongest wills" ✨
      </text>
    </g>
  </g>

  <!-- Right: Personal Info Dossier Box -->
  <g transform="translate(875, 48)">
    <rect x="0" y="0" width="285" height="252" rx="12" fill="#070b14" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.4"/>
    
    <text x="142" y="32" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="800" fill="#22d3ee" letter-spacing="1.5">PROFILE DOSSIER ✨</text>
    <line x1="20" y1="44" x2="265" y2="44" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Row 1: Location -->
    <g transform="translate(20, 75)">
      <text x="0" y="0" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#64748b">📍 LOCATION</text>
      <text x="0" y="20" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Tamil Nadu, India 🇮🇳</text>
    </g>

    <!-- Row 2: Born -->
    <g transform="translate(20, 132)">
      <text x="0" y="0" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#64748b">🎂 BORN ON</text>
      <text x="0" y="20" font-family="'JetBrains Mono',monospace" font-weight="800" font-size="17" fill="#facc15">18-08-2005 🎈</text>
    </g>

    <!-- Row 3: Engineering Focus with cute emojis -->
    <g transform="translate(20, 190)">
      <text x="0" y="0" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#64748b">🚀 CORE PASSION</text>
      <text x="0" y="20" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="15" fill="#34d399">AI • Code • Networks ⚡</text>
    </g>
  </g>
</svg>
