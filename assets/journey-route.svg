<svg viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jrTitle jrDesc">
  <title id="jrTitle">Trainer Journey Route Map</title>
  <desc id="jrDesc">Horizontal progression map showing Trainer Jaymithran's journey through Schooling, B.Tech AI/ML, TN State Gold, IndiaSkills Bronze, and Technical Trainer mentorship.</desc>
  <defs>
    <linearGradient id="jrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="routeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="75%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="jrGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="jrGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132035" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1200" height="240" fill="url(#jrBg)"/>
  <rect width="1200" height="240" fill="url(#jrGrid)"/>

  <rect x="16" y="16" width="1168" height="208" rx="14" fill="#0b1220" fill-opacity="0.7" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.3"/>

  <!-- Connecting Path Behind Nodes -->
  <line x1="120" y1="105" x2="1080" y2="105" stroke="url(#routeLine)" stroke-width="3.5" filter="url(#jrGlow)"/>

  <!-- ================= NODE 1: SCHOOLING ================= -->
  <g transform="translate(120, 105)">
    <circle cx="0" cy="0" r="18" fill="#070b14" stroke="#38bdf8" stroke-width="2.5" filter="url(#jrGlow)"/>
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
    <text x="0" y="-30" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#38bdf8">ROUTE 01</text>
    <text x="0" y="36" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Foundations</text>
    <text x="0" y="54" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#94a3b8">Maths &amp; CS</text>
    <text x="0" y="70" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#64748b">Sri Gopal Naidu HSS</text>
  </g>

  <!-- ================= NODE 2: B.TECH AI/ML ================= -->
  <g transform="translate(360, 105)">
    <circle cx="0" cy="0" r="18" fill="#070b14" stroke="#22d3ee" stroke-width="2.5" filter="url(#jrGlow)"/>
    <circle cx="0" cy="0" r="6" fill="#22d3ee"/>
    <text x="0" y="-30" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#22d3ee">ROUTE 02</text>
    <text x="0" y="36" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="13" fill="#f8fafc">B.Tech AI &amp; ML</text>
    <text x="0" y="54" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#facc15">CGPA: 8.99 / 10</text>
    <text x="0" y="70" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#64748b">Bannari Amman Inst.</text>
  </g>

  <!-- ================= NODE 3: STATE GOLD ================= -->
  <g transform="translate(600, 105)">
    <circle cx="0" cy="0" r="22" fill="#070b14" stroke="#facc15" stroke-width="2.8" filter="url(#jrGlow)"/>
    <circle cx="0" cy="0" r="8" fill="#facc15"/>
    <text x="0" y="-32" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#fde047">ROUTE 03 // 🥇</text>
    <text x="0" y="38" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="13" fill="#facc15">TN State Gold</text>
    <text x="0" y="56" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#94a3b8">1st Prize Champion</text>
    <text x="0" y="72" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#64748b">Network Administration</text>
  </g>

  <!-- ================= NODE 4: INDIASKILLS BRONZE ================= -->
  <g transform="translate(840, 105)">
    <circle cx="0" cy="0" r="20" fill="#070b14" stroke="#fb923c" stroke-width="2.5" filter="url(#jrGlow)"/>
    <circle cx="0" cy="0" r="7" fill="#fb923c"/>
    <text x="0" y="-30" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#fed7aa">ROUTE 04 // 🥉</text>
    <text x="0" y="36" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="13" fill="#fb923c">IndiaSkills Bronze</text>
    <text x="0" y="54" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#94a3b8">South Region Finalist</text>
    <text x="0" y="70" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#64748b">Live Firewall Defense</text>
  </g>

  <!-- ================= NODE 5: TECHNICAL TRAINER ================= -->
  <g transform="translate(1080, 105)">
    <circle cx="0" cy="0" r="22" fill="#070b14" stroke="#a78bfa" stroke-width="2.8" filter="url(#jrGlow)"/>
    <circle cx="0" cy="0" r="8" fill="#a78bfa"/>
    <text x="0" y="-32" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#e9d5ff">ROUTE 05 // 👨‍🏫</text>
    <text x="0" y="38" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="13" fill="#c084fc">Technical Trainer</text>
    <text x="0" y="56" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#94a3b8">60+ Students Mentored</text>
    <text x="0" y="72" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#64748b">120+ Lab Hours</text>
  </g>
</svg>
