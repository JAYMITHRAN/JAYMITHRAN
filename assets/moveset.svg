      <rect x="175" y="4" width="285" height="12" rx="6" fill="#1e293b"/>
      <rect x="175" y="4" width="270" height="12" rx="6" fill="#c084fc"/>
      <text x="480" y="14" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#e9d5ff">95%</text>
    </g>

    <!-- Item 3: Predictive Pipelines -->
    <g transform="translate(24, 136)">
      <text x="0" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Predictive AI Pipelines</text>
      <rect x="175" y="4" width="285" height="12" rx="6" fill="#1e293b"/>
      <rect x="175" y="4" width="255" height="12" rx="6" fill="#c084fc"/>
      <text x="480" y="14" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#e9d5ff">90%</text>
    </g>

    <!-- Item 4: Static Code Analysis -->
    <g transform="translate(24, 174)">
      <text x="0" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Static Code Analysis</text>
      <rect x="175" y="4" width="285" height="12" rx="6" fill="#1e293b"/>
      <rect x="175" y="4" width="265" height="12" rx="6" fill="#c084fc"/>
      <text x="480" y="14" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#e9d5ff">92%</text>
    </g>
  </g>

