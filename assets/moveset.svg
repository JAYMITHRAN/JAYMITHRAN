<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="msTitle msDesc">
  <title id="msTitle">Technical Stack &amp; Domain Capabilities</title>
  <desc id="msDesc">Four high-definition domain cards grouping technologies by specialization: Core Languages, Machine Intelligence, Infrastructure and Defense, and Modern Applications and Storage with large readable typography.</desc>
  <defs>
    <linearGradient id="msBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="msGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="msGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132035" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" fill="url(#msBg)"/>
  <rect width="1200" height="520" fill="url(#msGrid)"/>

  <!-- ================= CARD 1: CORE LANGUAGES ================= -->
  <g transform="translate(30, 20)">
    <rect width="560" height="230" rx="14" fill="#0b1220" fill-opacity="0.75" stroke="#facc15" stroke-width="1.5" filter="url(#msGlow)"/>
    <rect x="0" y="0" width="560" height="5" rx="2.5" fill="#facc15"/>
    <text x="24" y="34" font-family="'JetBrains Mono',monospace" font-size="15" font-weight="800" fill="#fde047" letter-spacing="1">⚡ CORE LANGUAGES &amp; LOGIC</text>
    
    <!-- Python -->
    <g transform="translate(24, 60)">
      <rect x="0" y="0" width="95" height="26" rx="7" fill="#facc15" fill-opacity="0.15" stroke="#facc15" stroke-width="1.2"/>
      <text x="47.5" y="17.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#fde047">Python</text>
      <text x="110" y="18" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">AI/ML Pipelines, AST Analysis &amp; Automation</text>
    </g>

    <!-- Java -->
    <g transform="translate(24, 98)">
      <rect x="0" y="0" width="95" height="26" rx="7" fill="#facc15" fill-opacity="0.15" stroke="#facc15" stroke-width="1.2"/>
      <text x="47.5" y="17.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#fde047">Java</text>
      <text x="110" y="18" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Object-Oriented Design &amp; Backend Systems</text>
    </g>

    <!-- C -->
    <g transform="translate(24, 136)">
      <rect x="0" y="0" width="95" height="26" rx="7" fill="#facc15" fill-opacity="0.15" stroke="#facc15" stroke-width="1.2"/>
      <text x="47.5" y="17.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#fde047">C</text>
      <text x="110" y="18" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Memory Management &amp; Core Data Structures</text>
    </g>

    <!-- JavaScript -->
    <g transform="translate(24, 174)">
      <rect x="0" y="0" width="95" height="26" rx="7" fill="#facc15" fill-opacity="0.15" stroke="#facc15" stroke-width="1.2"/>
      <text x="47.5" y="17.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#fde047">JavaScript</text>
      <text x="110" y="18" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Asynchronous Architecture, Modern ES6+</text>
    </g>
  </g>

  <!-- ================= CARD 2: AI / MACHINE LEARNING ================= -->
  <g transform="translate(610, 20)">
    <rect width="560" height="230" rx="14" fill="#0b1220" fill-opacity="0.75" stroke="#c084fc" stroke-width="1.5" filter="url(#msGlow)"/>
    <rect x="0" y="0" width="560" height="5" rx="2.5" fill="#c084fc"/>
    <text x="24" y="34" font-family="'JetBrains Mono',monospace" font-size="15" font-weight="800" fill="#e9d5ff" letter-spacing="1">🤖 MACHINE INTELLIGENCE &amp; AI/ML</text>
    
    <!-- Item 1 -->
    <g transform="translate(24, 60)">
      <circle cx="8" cy="12" r="4.5" fill="#c084fc"/>
      <text x="22" y="17" font-family="'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="700" fill="#f8fafc">Neural Network Architecture Design</text>
      <text x="22" y="34" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#94a3b8">Model training, loss optimization &amp; predictive pipelines</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(24, 114)">
      <circle cx="8" cy="12" r="4.5" fill="#c084fc"/>
      <text x="22" y="17" font-family="'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="700" fill="#f8fafc">AST Static Code Intelligence</text>
      <text x="22" y="34" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#94a3b8">Syntactic tree parsing &amp; algorithmic complexity analysis</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(24, 168)">
      <circle cx="8" cy="12" r="4.5" fill="#c084fc"/>
      <text x="22" y="17" font-family="'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="700" fill="#f8fafc">Automated Processing Pipelines</text>
      <text x="22" y="34" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#94a3b8">End-to-end data transformation &amp; inference workflows</text>
    </g>
  </g>

  <!-- ================= CARD 3: SYSTEMS & NETWORKING ================= -->
  <g transform="translate(30, 270)">
    <rect width="560" height="230" rx="14" fill="#0b1220" fill-opacity="0.75" stroke="#22d3ee" stroke-width="1.5" filter="url(#msGlow)"/>
    <rect x="0" y="0" width="560" height="5" rx="2.5" fill="#22d3ee"/>
    <text x="24" y="34" font-family="'JetBrains Mono',monospace" font-size="15" font-weight="800" fill="#67e8f9" letter-spacing="1">🌐 SYSTEMS, DEFENSE &amp; NETWORKING</text>
    
    <!-- Item 1 -->
    <g transform="translate(24, 60)">
      <rect x="0" y="0" width="145" height="26" rx="7" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-width="1.2"/>
      <text x="72.5" y="17.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#67e8f9">Cisco &amp; Juniper</text>
      <text x="160" y="18" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Enterprise Routing, VLANs, ACLs &amp; NAT</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(24, 98)">
      <rect x="0" y="0" width="145" height="26" rx="7" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-width="1.2"/>
      <text x="72.5" y="17.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#67e8f9">pfSense Firewall</text>
      <text x="160" y="18" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Stateful Hardening &amp; WireGuard Tunnels</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(24, 136)">
      <rect x="0" y="0" width="145" height="26" rx="7" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-width="1.2"/>
      <text x="72.5" y="17.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#67e8f9">Proxmox VE</text>
      <text x="160" y="18" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Bare-Metal Hypervisors &amp; Virtualization</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(24, 174)">
      <rect x="0" y="0" width="145" height="26" rx="7" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-width="1.2"/>
      <text x="72.5" y="17.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#67e8f9">Linux &amp; Docker</text>
      <text x="160" y="18" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Kernel Admin &amp; Isolated Sandboxes</text>
    </g>
  </g>

  <!-- ================= CARD 4: APPS & STORAGE ================= -->
  <g transform="translate(610, 270)">
    <rect width="560" height="230" rx="14" fill="#0b1220" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.5" filter="url(#msGlow)"/>
    <rect x="0" y="0" width="560" height="5" rx="2.5" fill="#38bdf8"/>
    <text x="24" y="34" font-family="'JetBrains Mono',monospace" font-size="15" font-weight="800" fill="#7dd3fc" letter-spacing="1">🗄️ FULL-STACK APPS &amp; STORAGE</text>
    
    <!-- Item 1 -->
    <g transform="translate(24, 60)">
      <rect x="0" y="0" width="140" height="26" rx="7" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="70" y="17.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#7dd3fc">React &amp; Native</text>
      <text x="155" y="18" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Sub-5s PWAs, Audio Streaming (EAS)</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(24, 98)">
      <rect x="0" y="0" width="140" height="26" rx="7" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="70" y="17.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#7dd3fc">FastAPI &amp; Node</text>
      <text x="155" y="18" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">High-Throughput APIs &amp; Auth Systems</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(24, 136)">
      <rect x="0" y="0" width="140" height="26" rx="7" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="70" y="17.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#7dd3fc">Tailwind CSS</text>
      <text x="155" y="18" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Modern Design Systems &amp; Premium UI</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(24, 174)">
      <rect x="0" y="0" width="140" height="26" rx="7" fill="#fb923c" fill-opacity="0.15" stroke="#fb923c" stroke-width="1.2"/>
      <text x="70" y="17.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#fdba74">MySQL &amp; Mongo</text>
      <text x="155" y="18" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Relational DBs, Document Schemas, Firebase</text>
    </g>
  </g>
</svg>
