    <text x="24" y="32" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#e9d5ff" letter-spacing="1">🧠 PSYCHIC TYPE — MACHINE INTELLIGENCE</text>
    
    <!-- Item 1: Neural Architectures -->
    <g transform="translate(24, 60)">
