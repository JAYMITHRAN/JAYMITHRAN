      <rect x="175" y="4" width="285" height="12" rx="6" fill="#1e293b"/>
      <rect x="175" y="4" width="285" height="12" rx="6" fill="#22d3ee"/>
      <text x="480" y="14" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#67e8f9">100%</text>
    </g>

    <!-- Item 2: pfSense Firewall -->
    <g transform="translate(24, 98)">
      <text x="0" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">pfSense Hardened Firewalls</text>
      <rect x="175" y="4" width="285" height="12" rx="6" fill="#1e293b"/>
      <rect x="175" y="4" width="285" height="12" rx="6" fill="#22d3ee"/>
      <text x="480" y="14" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#67e8f9">100%</text>
