      <text x="0" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Tailwind CSS &amp; HTML5/CSS3</text>
      <rect x="185" y="4" width="275" height="12" rx="6" fill="#1e293b"/>
      <rect x="185" y="4" width="275" height="12" rx="6" fill="#38bdf8"/>
      <text x="480" y="14" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#7dd3fc">100%</text>
    </g>

    <!-- Item 4: MySQL, MongoDB & Firebase -->
    <g transform="translate(24, 174)">
      <text x="0" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">MySQL • MongoDB • Firebase</text>
      <rect x="185" y="4" width="275" height="12" rx="6" fill="#1e293b"/>
      <rect x="185" y="4" width="250" height="12" rx="6" fill="#f59e0b"/>
      <text x="480" y="14" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#fbbf24">90%</text>
