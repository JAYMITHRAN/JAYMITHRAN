<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="msTitle msDesc">
  <title id="msTitle">Elemental Battle Moveset — Tech Stack</title>
  <desc id="msDesc">Four glassmorphism HUD cards grouping technology skills by Pokémon elemental affinities: Electric (Languages), Psychic (AI/ML), Steel (Networking and Infrastructure), and Water/Ground (Frameworks and Databases).</desc>
  <defs>
    <linearGradient id="msBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="msGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="msGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132035" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" fill="url(#msBg)"/>
  <rect width="1200" height="480" fill="url(#msGrid)"/>

  <!-- ================= CARD 1: ELECTRIC (LANGUAGES) ================= -->
  <g transform="translate(30, 20)">
    <rect width="560" height="210" rx="14" fill="#0b1220" fill-opacity="0.65" stroke="#facc15" stroke-width="1.3" filter="url(#msGlow)"/>
    <!-- Header -->
    <rect x="0" y="0" width="560" height="4" rx="2" fill="#facc15"/>
    <text x="24" y="32" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#fde047" letter-spacing="1">⚡ ELECTRIC TYPE — CORE LOGIC &amp; LANGUAGES</text>
    
    <!-- Item 1: Python -->
    <g transform="translate(24, 60)">
      <text x="0" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Python</text>
      <rect x="160" y="4" width="300" height="12" rx="6" fill="#1e293b"/>
      <rect x="160" y="4" width="300" height="12" rx="6" fill="#facc15"/>
      <text x="480" y="14" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#fde047">100%</text>
    </g>

    <!-- Item 2: Java -->
    <g transform="translate(24, 98)">
      <text x="0" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Java</text>
      <rect x="160" y="4" width="300" height="12" rx="6" fill="#1e293b"/>
      <rect x="160" y="4" width="300" height="12" rx="6" fill="#facc15"/>
      <text x="480" y="14" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#fde047">100%</text>
    </g>

    <!-- Item 3: C -->
    <g transform="translate(24, 136)">
      <text x="0" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">C</text>
      <rect x="160" y="4" width="300" height="12" rx="6" fill="#1e293b"/>
      <rect x="160" y="4" width="255" height="12" rx="6" fill="#fbbf24"/>
      <text x="480" y="14" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#fbbf24">85%</text>
    </g>

    <!-- Item 4: JavaScript -->
    <g transform="translate(24, 174)">
      <text x="0" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">JavaScript</text>
      <rect x="160" y="4" width="300" height="12" rx="6" fill="#1e293b"/>
      <rect x="160" y="4" width="265" height="12" rx="6" fill="#fbbf24"/>
      <text x="480" y="14" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#fbbf24">88%</text>
