      <text x="0" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Proxmox VE Hypervisors</text>
      <rect x="175" y="4" width="285" height="12" rx="6" fill="#1e293b"/>
      <rect x="175" y="4" width="265" height="12" rx="6" fill="#22d3ee"/>
      <text x="480" y="14" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#67e8f9">92%</text>
    </g>

    <!-- Item 4: Linux & Docker -->
    <g transform="translate(24, 174)">
      <text x="0" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Linux &amp; Docker Sandboxes</text>
      <rect x="175" y="4" width="285" height="12" rx="6" fill="#1e293b"/>
      <rect x="175" y="4" width="275" height="12" rx="6" fill="#22d3ee"/>
      <text x="480" y="14" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#67e8f9">96%</text>
    </g>
  </g>

  <!-- ================= CARD 4: WATER & GROUND (FRAMEWORKS & DB) ================= -->
  <g transform="translate(610, 250)">
    <rect width="560" height="210" rx="14" fill="#0b1220" fill-opacity="0.65" stroke="#38bdf8" stroke-width="1.3" filter="url(#msGlow)"/>
    <!-- Header -->
    <rect x="0" y="0" width="560" height="4" rx="2" fill="#38bdf8"/>
    <text x="24" y="32" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#7dd3fc" letter-spacing="1">💧 WATER &amp; 🪨 GROUND — APPS &amp; STORAGE</text>
    
    <!-- Item 1: React & React Native -->
    <g transform="translate(24, 60)">
      <text x="0" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">React &amp; React Native (PWA)</text>
      <rect x="185" y="4" width="275" height="12" rx="6" fill="#1e293b"/>
      <rect x="185" y="4" width="250" height="12" rx="6" fill="#38bdf8"/>
      <text x="480" y="14" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#7dd3fc">90%</text>
    </g>

    <!-- Item 2: FastAPI & Express -->
    <g transform="translate(24, 98)">
      <text x="0" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">FastAPI &amp; Express.js APIs</text>
      <rect x="185" y="4" width="275" height="12" rx="6" fill="#1e293b"/>
      <rect x="185" y="4" width="265" height="12" rx="6" fill="#38bdf8"/>
      <text x="480" y="14" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#7dd3fc">95%</text>
    </g>

