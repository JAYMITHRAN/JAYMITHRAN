<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="achTitle achDesc">
  <title id="achTitle">Achievements panel</title>
  <desc id="achDesc">Three glass cards: India Skills Competition South Region Bronze Medalist, Student Trainer for a six month networking fundamentals program, and spoken languages English Tamil Telugu</desc>
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <filter id="g5" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid5" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#101d33" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bg5)"/>
  <rect width="1200" height="260" fill="url(#grid5)"/>

  <!-- Card 1 -->
  <rect x="30" y="30" width="360" height="200" rx="14" fill="#0b1220" fill-opacity="0.4" stroke="#facc15" stroke-width="1.4" filter="url(#g5)"/>
  <!-- vector medal icon -->
  <g transform="translate(210,62)" filter="url(#g5)">
    <path d="M-9,-18 L-3,2 M9,-18 L3,2" stroke="#facc15" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="10" r="13" fill="#0b1220" stroke="#facc15" stroke-width="2"/>
    <path d="M0,2 L2.6,7.4 L8.5,8.2 L4.2,12.2 L5.3,18 L0,15 L-5.3,18 L-4.2,12.2 L-8.5,8.2 L-2.6,7.4 Z" fill="#facc15"/>
  </g>
  <text x="210" y="115" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="15" fill="#fde68a">INDIA SKILLS COMPETITION</text>
  <text x="210" y="140" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#e6f6ff">South Region Bronze Medalist</text>
  <text x="210" y="162" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#9fb3c8">IT Network System</text>
  <text x="210" y="180" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#9fb3c8">Administration</text>

  <!-- Card 2 -->
  <rect x="420" y="30" width="360" height="200" rx="14" fill="#0b1220" fill-opacity="0.4" stroke="#22d3ee" stroke-width="1.4" filter="url(#g5)"/>
  <!-- vector graduation cap icon -->
  <g transform="translate(600,64)" filter="url(#g5)">
    <path d="M-18,-2 L0,-11 L18,-2 L0,7 Z" fill="#0b1220" stroke="#67e8f9" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M-9,2 V10 Q0,16 9,10 V2" fill="none" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="18" y1="-2" x2="18" y2="9" stroke="#67e8f9" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="18" cy="12" r="1.8" fill="#67e8f9"/>
  </g>
  <text x="600" y="115" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="15" fill="#67e8f9">STUDENT TRAINER</text>
  <text x="600" y="140" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#e6f6ff">6-Month Networking</text>
  <text x="600" y="160" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#e6f6ff">Fundamentals Training</text>
  <text x="600" y="182" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#9fb3c8">Conducted for junior students</text>

  <!-- Card 3 -->
  <rect x="810" y="30" width="360" height="200" rx="14" fill="#0b1220" fill-opacity="0.4" stroke="#a78bfa" stroke-width="1.4" filter="url(#g5)"/>
  <!-- vector globe icon -->
  <g transform="translate(990,64)" filter="url(#g5)" fill="none" stroke="#a78bfa" stroke-width="1.6">
    <circle cx="0" cy="0" r="14"/>
    <ellipse cx="0" cy="0" rx="6" ry="14"/>
    <line x1="-14" y1="0" x2="14" y2="0"/>
    <line x1="-12.2" y1="-7" x2="12.2" y2="-7"/>
    <line x1="-12.2" y1="7" x2="12.2" y2="7"/>
  </g>
  <text x="990" y="115" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="15" fill="#c4b5fd">LANGUAGES</text>
  <text x="990" y="150" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#e6f6ff">English • Tamil • Telugu</text>
</svg>
