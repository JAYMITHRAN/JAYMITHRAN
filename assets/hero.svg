<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Jaymithran Radhakrishnan — AI x Code x Networks</title>
  <desc id="heroDesc">Futuristic neon glass hero banner reading Jaymithran Radhakrishnan, AI/ML Developer, Software Engineer, Network Systems Enthusiast</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="55%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#12233a" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#vignette)"/>

  <!-- outer glass frame -->
  <rect x="14" y="14" width="1172" height="272" rx="18" fill="#0b1220" fill-opacity="0.35" stroke="url(#cyanGrad)" stroke-opacity="0.55" stroke-width="1.4"/>
  <rect x="24" y="24" width="1152" height="252" rx="14" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- circuit traces left -->
  <g stroke="#1f6f8b" stroke-width="1.4" fill="none" opacity="0.7">
    <path d="M40 60 H140 L160 80 V140"/>
    <path d="M40 220 H120 L140 200 H210"/>
    <path d="M40 140 H90"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="40" cy="60" r="3.2" filter="url(#softGlow)"/>
    <circle cx="160" cy="140" r="3.2" filter="url(#softGlow)"/>
    <circle cx="40" cy="220" r="3.2" filter="url(#softGlow)"/>
    <circle cx="210" cy="200" r="3.2" filter="url(#softGlow)"/>
    <circle cx="40" cy="140" r="3.2" filter="url(#softGlow)"/>
  </g>

  <!-- circuit traces right -->
  <g stroke="#5b5fd6" stroke-width="1.4" fill="none" opacity="0.7">
    <path d="M1160 60 H1060 L1040 80 V140"/>
    <path d="M1160 230 H1080 L1060 210 H1000"/>
    <path d="M1160 150 H1110"/>
  </g>
  <g fill="#a5b4fc">
    <circle cx="1160" cy="60" r="3.2" filter="url(#softGlow)"/>
    <circle cx="1040" cy="140" r="3.2" filter="url(#softGlow)"/>
    <circle cx="1160" cy="230" r="3.2" filter="url(#softGlow)"/>
    <circle cx="1000" cy="210" r="3.2" filter="url(#softGlow)"/>
    <circle cx="1160" cy="150" r="3.2" filter="url(#softGlow)"/>
  </g>

  <!-- network node cluster top -->
  <g stroke="#22d3ee" stroke-width="1" opacity="0.5">
    <line x1="600" y1="46" x2="560" y2="70"/>
    <line x1="600" y1="46" x2="640" y2="70"/>
    <line x1="600" y1="46" x2="600" y2="70"/>
  </g>
  <g fill="#67e8f9" filter="url(#softGlow)">
    <circle cx="600" cy="46" r="3"/>
    <circle cx="560" cy="70" r="2.4"/>
    <circle cx="640" cy="70" r="2.4"/>
    <circle cx="600" cy="70" r="2.4"/>
  </g>

  <!-- terminal fragment -->
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" fill="#38bdf8" opacity="0.55">
    <text x="46" y="255">$ whoami</text>
    <text x="46" y="270">&gt; ai_ml_developer.init()</text>
  </g>
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" fill="#818cf8" opacity="0.5" text-anchor="end">
    <text x="1154" y="255">status: online</text>
    <text x="1154" y="270">uptime: building_systems()</text>
  </g>

  <!-- main title -->
  <text x="600" y="140" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="46" fill="#e6f6ff" filter="url(#glow)" letter-spacing="2">
    JAYMITHRAN RADHAKRISHNAN
  </text>

  <!-- identity line -->
  <text x="600" y="178" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="500" font-size="18" fill="url(#cyanGrad)" letter-spacing="1.5">
    AI/ML DEVELOPER • SOFTWARE ENGINEER • NETWORK SYSTEMS ENTHUSIAST
  </text>

  <!-- divider -->
  <line x1="430" y1="200" x2="770" y2="200" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.6"/>

  <!-- tagline -->
  <text x="600" y="228" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#9fb3c8">
    Building intelligent, automation-driven systems and exploring the intersection
  </text>
  <text x="600" y="248" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#9fb3c8">
    of AI, software engineering, and networking.
  </text>
</svg>
