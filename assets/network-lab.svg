<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="netTitle netDesc">
  <title id="netTitle">Private network and virtualized infrastructure lab topology</title>
  <desc id="netDesc">Network topology: internet into pfSense firewall, branching to Cisco and Juniper switching layers, converging into a Proxmox virtualization host running virtual machines and containers</desc>
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <filter id="g4" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid4" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#101d33" stroke-width="1"/>
    </pattern>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1200" height="480" fill="url(#bg4)"/>
  <rect width="1200" height="480" fill="url(#grid4)"/>
  <rect x="12" y="12" width="1176" height="456" rx="16" fill="#0b1220" fill-opacity="0.3" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.2"/>

  <text x="600" y="46" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="22" fill="#e6f6ff" letter-spacing="1.5" filter="url(#g4)">PRIVATE NETWORK &amp; VIRTUALIZED INFRASTRUCTURE LAB</text>

  <!-- INTERNET -->
  <circle cx="600" cy="100" r="10" fill="#0b1220" stroke="#94a3b8" stroke-width="2" filter="url(#g4)"/>
  <text x="600" y="80" text-anchor="middle" font-family="monospace" font-size="13" fill="#cbd5e1">INTERNET</text>
  <line x1="600" y1="110" x2="600" y2="150" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- pfSense -->
  <rect x="500" y="150" width="200" height="48" rx="10" fill="#0b1220" stroke="#67e8f9" stroke-width="1.6" filter="url(#g4)"/>
  <text x="600" y="180" text-anchor="middle" font-family="monospace" font-size="13" fill="#67e8f9">pfSense FIREWALL</text>

  <path d="M600 198 V225 H340 V255" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M600 198 V225 H860 V255" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Cisco -->
  <rect x="230" y="255" width="220" height="48" rx="10" fill="#0b1220" stroke="#38bdf8" stroke-width="1.5" filter="url(#g4)"/>
  <text x="340" y="285" text-anchor="middle" font-family="monospace" font-size="13" fill="#7dd3fc">CISCO SWITCHING</text>

  <!-- Juniper -->
  <rect x="750" y="255" width="220" height="48" rx="10" fill="#0b1220" stroke="#a78bfa" stroke-width="1.5" filter="url(#g4)"/>
  <text x="860" y="285" text-anchor="middle" font-family="monospace" font-size="13" fill="#c4b5fd">JUNIPER ROUTING</text>

  <path d="M340 303 V330 H600 V330" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <path d="M860 303 V330 H600 V330" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <line x1="600" y1="330" x2="600" y2="352" stroke="#34d399" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- Proxmox host -->
  <rect x="440" y="352" width="320" height="60" rx="12" fill="#0b1220" stroke="#34d399" stroke-width="1.8" filter="url(#g4)"/>
  <text x="600" y="378" text-anchor="middle" font-family="monospace" font-size="14" fill="#6ee7b7">PROXMOX VIRTUALIZATION HOST</text>
  <text x="600" y="398" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#a7f3d0">Network Segmentation • Routing Policies</text>

  <!-- VM / container nodes -->
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#d1fae5">
    <rect x="200" y="430" width="130" height="34" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.2"/>
    <text x="265" y="451" text-anchor="middle">Virtual Machines</text>

    <rect x="360" y="430" width="150" height="34" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.2"/>
    <text x="435" y="451" text-anchor="middle">Containerized Services</text>

    <rect x="540" y="430" width="150" height="34" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.2"/>
    <text x="615" y="451" text-anchor="middle">Firewall Policies</text>

    <rect x="720" y="430" width="150" height="34" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.2"/>
    <text x="795" y="451" text-anchor="middle">Segmented VLANs</text>
  </g>
  <g stroke="#34d399" stroke-width="1" opacity="0.5">
    <line x1="265" y1="430" x2="500" y2="412"/>
    <line x1="435" y1="430" x2="550" y2="412"/>
    <line x1="615" y1="430" x2="620" y2="412"/>
    <line x1="795" y1="430" x2="680" y2="412"/>
  </g>
</svg>
